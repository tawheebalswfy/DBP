name: RDP + MT5 REAL FIX

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create User
        shell: pwsh
        run: |
          $pass = "P@ssw0rd123!"
          net user RDP $pass /add
          net localgroup administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          echo "RDP_PASS=$pass" >> $env:GITHUB_ENV

      - name: Download MT5 Official
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $file = "C:\Users\RDP\Desktop\mt5.exe"

          Invoke-WebRequest -Uri $url -OutFile $file

      - name: Extract MT5 (Portable Trick)
        shell: pwsh
        run: |
          $file = "C:\Users\RDP\Desktop\mt5.exe"
          $dest = "C:\Users\RDP\Desktop\MT5"

          Start-Process -FilePath $file -ArgumentList "/portable" -Wait

      - name: Run MT5 + Login
        shell: pwsh
        run: |
          $terminal = Get-ChildItem "C:\Users\RDP" -Recurse -Filter "terminal64.exe" | Select-Object -First 1

          if (!$terminal) {
            Write-Host "MT5 NOT FOUND ❌"
            exit 1
          }

          $configPath = "$env:TEMP\config.ini"

          Add-Content $configPath "[Common]"
          Add-Content $configPath "Login=1069352"
          Add-Content $configPath "Password=#wU3Q!Xp"
          Add-Content $configPath "Server=VTMarkets-Demo"

          Start-Process -FilePath $terminal.FullName -ArgumentList "/portable /config:$configPath"

          Write-Host "MT5 RUNNING ✅"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $file = "$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri $url -OutFile $file
          Start-Process msiexec.exe -ArgumentList "/i `"$file`" /quiet" -Wait

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          & $exe up --authkey=$env:TAILSCALE_AUTH_KEY

          $ip = (& $exe ip -4 | Select-Object -First 1)
          echo "IP=$ip" >> $env:GITHUB_ENV

      - name: Show Info
        shell: pwsh
        run: |
          Write-Host "IP: $env:IP"
          Write-Host "User: $env:RDP_USER"
          Write-Host "Pass: $env:RDP_PASS"

      - name: Keep Alive
        shell: pwsh
        run: |
          Start-Sleep -Seconds 20000

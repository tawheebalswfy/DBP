name: RDP + Final Dual Platforms (Correct Paths)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: 1. Setup RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          Restart-Service -Name TermService -Force

      - name: 2. Create RDP User
        shell: pwsh
        run: |
          $password = "Admin@MT5#2026"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          $user = "RDP"
          New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $user
          "RDP_USER=$user" >> $env:GITHUB_ENV
          "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: 3. Download and Extract to Dynamic Desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "gh-actions" }
          $allReleases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers $headers
          $allAssets = $allReleases.assets
          
          # تحديد مسار سطح المكتب الصحيح ديناميكياً
          $desktop = [System.Environment]::GetFolderPath("Desktop")
          Write-Host "Target Desktop Path: $desktop"

          # تحميل MT4 & MT5
          $assetMT4 = $allAssets | Where-Object { $_.name -like "*OneRoyal.MT4.Terminal.zip*" } | Select-Object -First 1
          $assetMT5 = $allAssets | Where-Object { $_.name -like "*MetaTrader.5.zip*" } | Select-Object -First 1

          if ($assetMT4) {
              Invoke-WebRequest -Uri $assetMT4.browser_download_url -OutFile "$env:TEMP\MT4.zip" -Headers $headers
              Expand-Archive -Path "$env:TEMP\MT4.zip" -DestinationPath "$desktop\MT4_Platform" -Force
          }
          if ($assetMT5) {
              Invoke-WebRequest -Uri $assetMT5.browser_download_url -OutFile "$env:TEMP\MT5.zip" -Headers $headers
              Expand-Archive -Path "$env:TEMP\MT5.zip" -DestinationPath "$desktop\MT5_Platform" -Force
          }

      - name: 4. Inject Login Configs
        shell: pwsh
        run: |
          $desktop = [System.Environment]::GetFolderPath("Desktop")
          
          # MT5: Launcher Config (vm.ini)
          $mt5Dir = Get-ChildItem -Path "$desktop\MT5_Platform" -Filter "launcher.exe" -Recurse | Select-Object -First 1
          if ($mt5Dir) {
              "[Common]`nLogin=1069352`nPassword=#wU3Q!Xp`nServer=VTMarkets-Demo" | Out-File (Join-Path $mt5Dir.DirectoryName "vm.ini") -Encoding ascii
          }

          # MT4: Terminal Config (common.ini)
          $mt4Dir = Get-ChildItem -Path "$desktop\MT4_Platform" -Filter "terminal.exe" -Recurse | Select-Object -First 1
          if ($mt4Dir) {
              $cfgDir = Join-Path $mt4Dir.DirectoryName "config"
              if (-not (Test-Path $cfgDir)) { New-Item -ItemType Directory -Path $cfgDir }
              "[Common]`nLogin=31335811`nPassword=dcym47`nServer=ICMarketsSC-Demo03" | Out-File (Join-Path $cfgDir "common.ini") -Encoding ascii
          }

      - name: 5. Connect Tailscale
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "ts.msi", "/quiet", "/norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_KEY --hostname=Trader-VM
          $tsIP = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4) | Select-Object -First 1
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: 6. Launch Platforms (Launcher & Terminal)
        shell: pwsh
        run: |
          $desktop = [System.Environment]::GetFolderPath("Desktop")
          
          # تشغيل MT5 عبر launcher.exe
          $mt5 = Get-ChildItem -Path "$desktop\MT5_Platform" -Filter "launcher.exe" -Recurse | Select-Object -First 1
          if ($mt5) { Start-Process $mt5.FullName -WorkingDirectory $mt5.DirectoryName }
          
          # تشغيل MT4 عبر terminal.exe
          $mt4 = Get-ChildItem -Path "$desktop\MT4_Platform" -Filter "terminal.exe" -Recurse | Select-Object -First 1
          if ($mt4) { Start-Process $mt4.FullName -ArgumentList "/portable" -WorkingDirectory $mt4.DirectoryName }

      - name: 7. Keep Alive
        shell: pwsh
        run: |
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "User    : $env:RDP_USER"
          Write-Host "Pass    : $env:RDP_PASS"
          $end = (Get-Date).AddMinutes(345)
          while ((Get-Date) -lt $end) { Start-Sleep -Seconds 60 }

name: RDP (Tailscale) + Restore OneRoyal MT4 from Release

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings (safer)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          # Firewall: allow RDP only from Tailscale range
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10 | Out-Null

          Restart-Service -Name TermService -Force

      - name: Create/Update RDP user (fixed password from secret)
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw "Missing secret: RDP_PASSWORD" }
          Write-Host "::add-mask::$env:RDP_PASSWORD"

          $user = "RDP"
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name $user -Password $securePass
          }

          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path "C:\Users\RDP\Desktop" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\Users\Public\Desktop" | Out-Null

      - name: Download OneRoyal MT4 ZIP from latest Release + unzip to Desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $owner = "${{ github.repository_owner }}"
          $repo  = "${{ github.event.repository.name }}"
          $assetName = "OneRoyal.MT4.Terminal.zip"

          $api = "https://api.github.com/repos/$owner/$repo/releases/latest"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent"  = "gh-actions"
            Accept        = "application/vnd.github+json"
          }

          $rel = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) {
            $names = ($rel.assets | ForEach-Object { $_.name }) -join ", "
            throw "Asset not found. Expected: $assetName. Found: $names"
          }

          $rdpDesktop    = "C:\Users\RDP\Desktop"
          $publicDesktop = "C:\Users\Public\Desktop"

          $zipPath1 = Join-Path $rdpDesktop $assetName
          $zipPath2 = Join-Path $publicDesktop $assetName

          # Download once, then copy to Public Desktop
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath1 -Headers $headers
          Copy-Item -Force $zipPath1 $zipPath2

          # Extract to folder on RDP desktop
          $extractDir = Join-Path $rdpDesktop "Restored_OneRoyal_MT4"
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Expand-Archive -Path $zipPath1 -DestinationPath $extractDir -Force

          "OneRoyal MT4 restored to: $extractDir" | Out-File (Join-Path $rdpDesktop "README_RESTORED.txt") -Encoding utf8 -Force

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { throw "Missing secret: TAILSCALE_AUTH_KEY" }

          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          & $tsExe up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-rdp-$env:GITHUB_RUN_ID | Out-Null

          $tsIP = $null
          for ($i=0; $i -lt 20; $i++) {
            $tsIP = (& $tsExe ip -4) | Select-Object -First 1
            if ($tsIP) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $tsIP) { throw "Tailscale IP not assigned" }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show RDP access info
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== RDP ACCESS (via Tailscale) ==="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: (stored in secret RDP_PASSWORD)"
          Write-Host "MT4 ZIP  : C:\Users\RDP\Desktop\OneRoyal.MT4.Terminal.zip"
          Write-Host "Extract : C:\Users\RDP\Desktop\Restored_OneRoyal_MT4"
          Write-Host "================================="
          Write-Host ""

      - name: Maintain Connection (max ~6h on GitHub-hosted)
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes(345)
          while ((Get-Date) -lt $end) {
            Write-Host "[$(Get-Date -Format s)] RDP Active"
            Start-Sleep -Seconds 300
          }

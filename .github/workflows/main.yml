name: RDP (Tailscale) - Fixed Password

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          Restart-Service -Name TermService -Force

      - name: Create RDP User (fixed password)
        shell: pwsh
        run: |
          $user = "RDP"
          $pass = "tawheeb"

          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force

          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $user -Password $securePass
          } else {
            New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

      - name: Install Tailscale
        shell: pwsh
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait
          Start-Service Tailscale -ErrorAction SilentlyContinue

      - name: Connect Tailscale + Get IP
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID" `
            --unattended --reset

          $tsIP = $null
          1..20 | ForEach-Object {
            try { $tsIP = (& $ts ip -4).Trim() } catch {}
            if ($tsIP) { return }
            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) { throw "No Tailscale IP assigned" }

          Write-Host ""
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address : $tsIP"
          Write-Host "Username: RDP"
          Write-Host "Password: tawheeb"
          Write-Host "================="

      - name: Firewall - allow RDP only over Tailscale
        shell: pwsh
        run: |
          Get-NetFirewallRule -DisplayName "RDP over Tailscale" -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          New-NetFirewallRule -DisplayName "RDP over Tailscale" `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" -Profile Any | Out-Null

      - name: Keep Alive
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] RDP is running..."
            Start-Sleep -Seconds 300
          }

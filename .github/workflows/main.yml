name: RDP + MT5 Final Setup

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: 1. Setup Folders
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "C:\MT5"

      - name: 2. Download MT5 ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $owner = "tawheebalswfy"
          $repo  = "DBP"
          $api = "https://api.github.com/repos/$owner/$repo/releases/latest"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod -Uri $api -Headers $headers
          
          # الكود سيبحث عن ملفك MetaTrader.5.zip
          $asset = $rel.assets | Where-Object { $_.name -like "*MetaTrader.5.zip*" } | Select-Object -First 1
          if (-not $asset) { throw "File MetaTrader.5.zip not found in Release!" }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "C:\MT5\mt5.zip" -Headers $headers
          Expand-Archive -Path "C:\MT5\mt5.zip" -DestinationPath "C:\MT5" -Force

      - name: 3. Configure RDP & User
        shell: pwsh
        run: |
          $pass = "Admin@MT5#2026"
          $secPass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $secPass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

      - name: 4. Launch MT5 with Auto Login
        shell: pwsh
        run: |
          # البحث عن terminal64.exe
          $exe = Get-ChildItem -Path "C:\MT5" -Filter "terminal64.exe" -Recurse | Select-Object -First 1
          if ($exe) {
              # التشغيل المباشر بالبيانات المطلوبة
              Start-Process -FilePath $exe.FullName -ArgumentList "/portable /login:1069352 /password:'#wU3Q!Xp' /server:VTMarkets-Demo"
              Write-Host "MT5 Started Successfully"
          } else {
              Write-Error "terminal64.exe not found!"
              exit 1
          }

      - name: 5. Connect Tailscale
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "ts.msi", "/quiet", "/norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_KEY --hostname=GH-MT5
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4)
          Write-Host "RDP IP: $ip"

      - name: 6. Keep Alive
        shell: pwsh
        run: |
          $limit = (Get-Date).AddMinutes(345)
          while ((Get-Date) -lt $limit) { Start-Sleep -Seconds 60 }

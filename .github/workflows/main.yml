name: RDP (Tailscale) - Reprovision Each Run

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Cache tools (Tailscale MSI)
        uses: actions/cache@v4
        with:
          path: |
            C:\tools
          key: win-tools-${{ runner.os }}-v1

      - name: Enable RDP (safe defaults)
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          Restart-Service -Name TermService -Force

      - name: Create RDP User (masked password)
        shell: pwsh
        run: |
          $chars = ('ABCDEFGHJKLMNPQRSTUVWXYZ' + 'abcdefghijkmnopqrstuvwxyz' + '23456789' + '!@#$%^&*()-_=+[]{}')
          $password = -join (1..20 | ForEach-Object { $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)] })
          Write-Host "::add-mask::$password"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP"
          }

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          "RDP_USER=RDP" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RDP_PASS=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download + Install Tailscale (cached)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\tools | Out-Null
          $msi = "C:\tools\tailscale.msi"

          if (-not (Test-Path $msi)) {
            Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          }

          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait

          Start-Service Tailscale -ErrorAction SilentlyContinue

      - name: Connect Tailscale + Get IP
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended --reset

          $tsIP = $null
          1..25 | ForEach-Object {
            try { $tsIP = (& $ts ip -4).Trim() } catch {}
            if ($tsIP) { return }
            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) { throw "No Tailscale IP assigned" }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tailscale IP: $tsIP"

      - name: Firewall - allow RDP only over Tailscale range
        shell: pwsh
        run: |
          Get-NetFirewallRule -DisplayName "RDP over Tailscale" -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue

          New-NetFirewallRule -DisplayName "RDP over Tailscale" `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" -Profile Any | Out-Null

      - name: Show access info (password masked in logs)
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "==================`n"

      - name: Keep Alive
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] Still running..."
            Start-Sleep -Seconds 300
          }

name: RDP + MT5 Launcher Auto-Login

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: 1. Setup Folders
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "C:\MT5"

      - name: 2. Download and Extract MT5 ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $owner = "tawheebalswfy"
          $repo  = "DBP"
          $api = "https://api.github.com/repos/$owner/$repo/releases/latest"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -like "*MetaTrader.5.zip*" } | Select-Object -First 1
          
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "C:\MT5\mt5.zip" -Headers $headers
          Expand-Archive -Path "C:\MT5\mt5.zip" -DestinationPath "C:\MT5" -Force

      - name: 3. Create Login Config (vm.ini)
        shell: pwsh
        run: |
          # إنشاء ملف الإعدادات داخل مجلد البرنامج الرئيسي
          $configContent = @"
          [Common]
          Login=1069352
          Password=#wU3Q!Xp
          Server=VTMarkets-Demo
          EnableNews=0
          ProxyEnable=0
          "@
          # سنقوم بوضع الملف في المجلد الرئيسي وفي مجلد config للاحتياط
          $basePath = Get-ChildItem -Path "C:\MT5" -Filter "launcher.exe" -Recurse | Select-Object -ExpandProperty DirectoryName -First 1
          $configPath = Join-Path $basePath "config"
          if (-not (Test-Path $configPath)) { New-Item -ItemType Directory -Path $configPath }
          
          $configContent | Out-File -FilePath (Join-Path $basePath "vm.ini") -Encoding ascii
          $configContent | Out-File -FilePath (Join-Path $configPath "common.ini") -Encoding ascii
          Write-Host "Config files created in $basePath"

      - name: 4. Configure RDP User
        shell: pwsh
        run: |
          $pass = "Admin@MT5#2026"
          $secPass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $secPass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

      - name: 5. Start MT5 via Launcher
        shell: pwsh
        run: |
          # البحث عن launcher.exe وتشغيله
          $launcher = Get-ChildItem -Path "C:\MT5" -Filter "launcher.exe" -Recurse | Select-Object -First 1
          if ($launcher) {
              Write-Host "Launching MT5 via: $($launcher.FullName)"
              # تشغيل الـ Launcher مع تمرير ملف الإعدادات للتيرمينال
              Start-Process -FilePath $launcher.FullName -WorkingDirectory $launcher.DirectoryName
              
              # انتظار بسيط ثم محاولة تشغيل التيرمينال بملف الإعدادات إذا لم يقم اللاونشر بذلك
              Start-Sleep -Seconds 10
              $terminal = Get-ChildItem -Path "C:\MT5" -Filter "terminal64.exe" -Recurse | Select-Object -First 1
              if ($terminal) {
                  Start-Process -FilePath $terminal.FullName -ArgumentList "/portable /config:vm.ini" -WorkingDirectory $terminal.DirectoryName
              }
          } else {
              Write-Error "launcher.exe not found!"
              exit 1
          }

      - name: 6. Connect Tailscale
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "ts.msi", "/quiet", "/norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_KEY --hostname=GH-MT5
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4)
          Write-Host "RDP IP: $ip"

      - name: 7. Keep Alive
        shell: pwsh
        run: |
          $limit = (Get-Date).AddMinutes(345)
          while ((Get-Date) -lt $limit) { Start-Sleep -Seconds 60 }

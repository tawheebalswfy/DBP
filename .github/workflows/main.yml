name: RDP + MT4 + MT5 + Digital Time Wheel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. SETUP RDP
      # ============================================================

      - name: 1. Setup RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            | Out-Null

          Restart-Service `
            -Name TermService `
            -Force


      # ============================================================
      # 2. CREATE RDP USER
      # ============================================================

      - name: 2. Create RDP User
        shell: pwsh
        run: |
          $password = "Admin@MT5#2026"

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = "RDP"

          try {
              New-LocalUser `
                -Name $user `
                -Password $securePass `
                -AccountNeverExpires `
                -ErrorAction Stop
          }
          catch {
              Write-Host "RDP user may already exist."
          }

          try {
              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member $user `
                -ErrorAction Stop
          }
          catch {}

          try {
              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member $user `
                -ErrorAction Stop
          }
          catch {}

          $rdpDesktop = "C:\Users\$user\Desktop"

          New-Item `
            -ItemType Directory `
            -Path $rdpDesktop `
            -Force `
            | Out-Null

          "RDP_USER=$user" >> $env:GITHUB_ENV
          "RDP_PASS=$password" >> $env:GITHUB_ENV
          "RDP_DESKTOP=$rdpDesktop" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "RDP User:"
          Write-Host $user

          Write-Host ""
          Write-Host "RDP Desktop:"
          Write-Host $rdpDesktop


      # ============================================================
      # 3. DOWNLOAD MT4 + MT5
      # ============================================================

      - name: 3. Download MT4 and MT5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              "User-Agent"  = "gh-actions"
              Accept        = "application/vnd.github+json"
          }

          $repo = "${{ github.repository }}"
          $desktop = $env:RDP_DESKTOP

          if (-not $desktop) {
              $desktop = "C:\Users\RDP\Desktop"
          }

          New-Item `
            -ItemType Directory `
            -Path $desktop `
            -Force `
            | Out-Null

          $releases = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$repo/releases" `
            -Headers $headers

          $assetMT4 = $null
          $assetMT5 = $null

          $assetMT4Release = $null
          $assetMT5Release = $null

          foreach ($release in $releases) {

              if (-not $release.assets) {
                  continue
              }

              if (-not $assetMT4) {

                  $candidateMT4 = $release.assets |
                    Where-Object {
                        $_.name -like "*OneRoyal.MT4.Terminal.zip*"
                    } |
                    Select-Object -First 1

                  if ($candidateMT4) {
                      $assetMT4 = $candidateMT4
                      $assetMT4Release = $release.tag_name
                  }
              }

              if (-not $assetMT5) {

                  $candidateMT5 = $release.assets |
                    Where-Object {
                        $_.name -like "*MetaTrader.5.zip*" -or
                        $_.name -like "*MT5.zip*"
                    } |
                    Select-Object -First 1

                  if ($candidateMT5) {
                      $assetMT5 = $candidateMT5
                      $assetMT5Release = $release.tag_name
                  }
              }

              if ($assetMT4 -and $assetMT5) {
                  break
              }
          }


          # ========================================================
          # MT4
          # ========================================================

          if ($assetMT4) {

              Write-Host "Downloading MT4:"
              Write-Host $assetMT4.name

              Write-Host "Release:"
              Write-Host $assetMT4Release

              $mt4Zip = "$env:TEMP\MT4.zip"
              $mt4Destination = "$desktop\MT4_Platform"

              if (Test-Path $mt4Destination) {
                  Remove-Item `
                    $mt4Destination `
                    -Recurse `
                    -Force
              }

              Invoke-WebRequest `
                -Uri $assetMT4.browser_download_url `
                -OutFile $mt4Zip `
                -Headers $headers

              Expand-Archive `
                -Path $mt4Zip `
                -DestinationPath $mt4Destination `
                -Force
          }
          else {

              Write-Host "MT4 not found." `
                -ForegroundColor Red

              exit 1
          }


          # ========================================================
          # MT5
          # ========================================================

          if ($assetMT5) {

              Write-Host "Downloading MT5:"
              Write-Host $assetMT5.name

              Write-Host "Release:"
              Write-Host $assetMT5Release

              $mt5Zip = "$env:TEMP\MT5.zip"
              $mt5Destination = "$desktop\MT5_Platform"

              if (Test-Path $mt5Destination) {
                  Remove-Item `
                    $mt5Destination `
                    -Recurse `
                    -Force
              }

              Invoke-WebRequest `
                -Uri $assetMT5.browser_download_url `
                -OutFile $mt5Zip `
                -Headers $headers

              Expand-Archive `
                -Path $mt5Zip `
                -DestinationPath $mt5Destination `
                -Force
          }
          else {

              Write-Host "MT5 not found." `
                -ForegroundColor Red

              exit 1
          }


      # ============================================================
      # 4. DOWNLOAD DIGITAL TIME WHEEL
      # ============================================================

      - name: 4. Download Digital Time Wheel
        shell: pwsh
        run: |
          $desktop = $env:RDP_DESKTOP

          if (-not $desktop) {
              $desktop = "C:\Users\RDP\Desktop"
          }

          $projectPath = Join-Path `
            $desktop `
            "digital-time-wheel"

          if (Test-Path $projectPath) {

              Write-Host "Removing previous digital-time-wheel..."

              Remove-Item `
                $projectPath `
                -Recurse `
                -Force
          }

          Write-Host ""
          Write-Host "Cloning digital-time-wheel..."
          Write-Host ""

          git clone `
            https://github.com/tawheebalswfy/digital-time-wheel.git `
            $projectPath

          if ($LASTEXITCODE -ne 0) {

              Write-Host "Git clone failed." `
                -ForegroundColor Red

              exit 1
          }

          if (-not (Test-Path $projectPath)) {

              Write-Host "Project directory was not created." `
                -ForegroundColor Red

              exit 1
          }

          "DIGITAL_TIME_WHEEL=$projectPath" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Project downloaded:"
          Write-Host $projectPath
          Write-Host ""


      # ============================================================
      # 5. FIND REAL APP + INSTALL PACKAGES
      # ============================================================

      - name: 5. Find App and Install Digital Time Wheel Packages
        shell: pwsh
        run: |
          $repoPath = $env:DIGITAL_TIME_WHEEL

          if (-not $repoPath) {
              $repoPath = "C:\Users\RDP\Desktop\digital-time-wheel"
          }

          if (-not (Test-Path $repoPath)) {

              Write-Host "Digital Time Wheel repository not found." `
                -ForegroundColor Red

              exit 1
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "Searching for application package.json"
          Write-Host "============================================"
          Write-Host ""

          $packageFiles = Get-ChildItem `
            -Path $repoPath `
            -Filter "package.json" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.FullName -notmatch "\\node_modules\\"
            }

          if (-not $packageFiles) {

              Write-Host "No package.json found anywhere." `
                -ForegroundColor Red

              Write-Host ""
              Write-Host "Repository files:"
              Write-Host ""

              Get-ChildItem `
                -Path $repoPath `
                -Recurse `
                -Depth 3 `
                -ErrorAction SilentlyContinue |
                Select-Object FullName |
                Format-Table -AutoSize

              exit 1
          }

          $selectedPackage = $null

          foreach ($pkgFile in $packageFiles) {

              try {

                  $pkg = Get-Content `
                    $pkgFile.FullName `
                    -Raw |
                    ConvertFrom-Json

                  $scripts = @()

                  if ($pkg.scripts) {
                      $scripts = @(
                          $pkg.scripts.PSObject.Properties.Name
                      )
                  }

                  Write-Host "Found:"
                  Write-Host $pkgFile.FullName
                  Write-Host "Scripts: $($scripts -join ', ')"
                  Write-Host ""

                  if (
                      ($scripts -contains "dev") -or
                      ($scripts -contains "start")
                  ) {

                      $selectedPackage = $pkgFile
                      break
                  }
              }
              catch {

                  Write-Host "Could not read:"
                  Write-Host $pkgFile.FullName
              }
          }

          if (-not $selectedPackage) {

              Write-Host "No package.json with dev/start found." `
                -ForegroundColor Red

              exit 1
          }

          $appPath = $selectedPackage.DirectoryName

          "DIGITAL_APP_PATH=$appPath" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "============================================"
          Write-Host "Application found:"
          Write-Host $appPath
          Write-Host "============================================"
          Write-Host ""

          # --------------------------------------------------------
          # Find package manager / install root
          # --------------------------------------------------------

          $installPath = $appPath
          $current = $appPath
          $manager = "npm"

          while ($true) {

              if (Test-Path (Join-Path $current "pnpm-lock.yaml")) {
                  $manager = "pnpm"
                  $installPath = $current
                  break
              }

              if (Test-Path (Join-Path $current "yarn.lock")) {
                  $manager = "yarn"
                  $installPath = $current
                  break
              }

              if (Test-Path (Join-Path $current "package-lock.json")) {
                  $manager = "npm"
                  $installPath = $current
                  break
              }

              if ($current -eq $repoPath) {
                  break
              }

              $parent = Split-Path $current -Parent

              if (
                  (-not $parent) -or
                  ($parent.Length -lt $repoPath.Length)
              ) {
                  break
              }

              $current = $parent
          }

          "DIGITAL_PACKAGE_MANAGER=$manager" >> $env:GITHUB_ENV
          "DIGITAL_INSTALL_PATH=$installPath" >> $env:GITHUB_ENV

          Write-Host "Package manager:"
          Write-Host $manager

          Write-Host ""
          Write-Host "Install directory:"
          Write-Host $installPath

          Write-Host ""

          Set-Location $installPath

          if ($manager -eq "pnpm") {

              Write-Host "Installing with pnpm..."

              corepack enable

              pnpm install

              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }
          elseif ($manager -eq "yarn") {

              Write-Host "Installing with yarn..."

              corepack enable

              yarn install

              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }
          else {

              Write-Host "Installing with npm..."

              if (Test-Path "$installPath\package-lock.json") {
                  npm ci

                  if ($LASTEXITCODE -ne 0) {

                      Write-Host "npm ci failed, trying npm install..."

                      npm install
                  }
              }
              else {
                  npm install
              }

              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

          Write-Host ""
          Write-Host "Dependencies installed successfully."
          Write-Host ""


      # ============================================================
      # 6. START DIGITAL TIME WHEEL
      # ============================================================

      - name: 6. Start Digital Time Wheel
        shell: pwsh
        run: |
          $appPath = $env:DIGITAL_APP_PATH
          $manager = $env:DIGITAL_PACKAGE_MANAGER

          if (-not $appPath) {

              Write-Host "DIGITAL_APP_PATH is missing." `
                -ForegroundColor Red

              exit 1
          }

          if (-not (Test-Path $appPath)) {

              Write-Host "Application directory not found." `
                -ForegroundColor Red

              exit 1
          }

          Set-Location $appPath

          $packageJsonPath = Join-Path `
            $appPath `
            "package.json"

          if (-not (Test-Path $packageJsonPath)) {

              Write-Host "Application package.json missing." `
                -ForegroundColor Red

              exit 1
          }

          $packageJson = Get-Content `
            $packageJsonPath `
            -Raw |
            ConvertFrom-Json

          $scriptNames = @()

          if ($packageJson.scripts) {
              $scriptNames = @(
                  $packageJson.scripts.PSObject.Properties.Name
              )
          }

          Write-Host ""
          Write-Host "Available scripts:"
          Write-Host ($scriptNames -join ", ")
          Write-Host ""

          $script = $null

          if ($scriptNames -contains "dev") {
              $script = "dev"
          }
          elseif ($scriptNames -contains "start") {
              $script = "start"
          }

          if (-not $script) {

              Write-Host "No dev or start script found." `
                -ForegroundColor Red

              exit 1
          }

          if (-not $manager) {
              $manager = "npm"
          }

          if ($manager -eq "pnpm") {
              $command = "pnpm run $script"
          }
          elseif ($manager -eq "yarn") {
              $command = "yarn $script"
          }
          else {
              $command = "npm run $script"
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "Starting Digital Time Wheel"
          Write-Host "============================================"
          Write-Host ""

          Write-Host "Application:"
          Write-Host $appPath

          Write-Host ""
          Write-Host "Command:"
          Write-Host $command

          Write-Host ""

          $serverLog = `
            "C:\Users\RDP\Desktop\digital-time-wheel-server.log"

          $serverCommand = @"
          Set-Location '$appPath'

          Write-Host 'Digital Time Wheel Server'
          Write-Host 'Path: $appPath'
          Write-Host 'Command: $command'

          $command *>> '$serverLog'
          "@

          $encoded = [Convert]::ToBase64String(
              [Text.Encoding]::Unicode.GetBytes($serverCommand)
          )

          Start-Process `
            powershell.exe `
            -ArgumentList `
              "-NoProfile",
              "-ExecutionPolicy",
              "Bypass",
              "-EncodedCommand",
              $encoded `
            -WindowStyle Hidden

          Start-Sleep -Seconds 20

          Write-Host ""
          Write-Host "Checking web ports..."
          Write-Host ""

          $commonPorts = @(
              3000,
              3001,
              4173,
              4200,
              5000,
              5173,
              5174,
              8000,
              8080
          )

          $listening = Get-NetTCPConnection `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.LocalPort -in $commonPorts
            }

          if ($listening) {

              $listening |
                Format-Table `
                  LocalAddress,
                  LocalPort,
                  State `
                -AutoSize

              $webPort = (
                  $listening |
                  Select-Object -First 1
              ).LocalPort

              "DIGITAL_WEB_PORT=$webPort" >> $env:GITHUB_ENV

              Write-Host ""
              Write-Host "Detected website port:"
              Write-Host $webPort
          }
          else {

              Write-Host ""
              Write-Host "No common web port detected yet." `
                -ForegroundColor Yellow

              Write-Host ""
              Write-Host "Server log:"
              Write-Host $serverLog

              if (Test-Path $serverLog) {

                  Write-Host ""
                  Write-Host "Last server log lines:"
                  Write-Host ""

                  Get-Content `
                    $serverLog `
                    -Tail 50 `
                    -ErrorAction SilentlyContinue
              }
          }


      # ============================================================
      # 7. CREATE CHROME AUTO-OPEN FOR RDP USER
      # ============================================================

      - name: 7. Configure Chrome Auto Open
        shell: pwsh
        run: |
          $rdpProfile = "C:\Users\RDP"

          $startupFolder = Join-Path `
            $rdpProfile `
            "AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          New-Item `
            -ItemType Directory `
            -Path $startupFolder `
            -Force `
            | Out-Null

          $startupFile = Join-Path `
            $startupFolder `
            "Open-Digital-Time-Wheel.cmd"

          @'
          @echo off

          timeout /t 10 /nobreak >nul

          powershell -NoProfile -ExecutionPolicy Bypass -Command "$ports = @(5173,3000,3001,5174,4173,4200,5000,8000,8080); $found = $null; foreach ($p in $ports) { try { $r = Invoke-WebRequest -Uri ('http://localhost:' + $p) -UseBasicParsing -TimeoutSec 2; if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 500) { $found = $p; break } } catch {} }; if ($found) { Set-Content -Path $env:TEMP\digital-wheel-port.txt -Value $found }"

          set PORT=

          if exist "%TEMP%\digital-wheel-port.txt" (
              set /p PORT=<"%TEMP%\digital-wheel-port.txt"
          )

          if "%PORT%"=="" set PORT=5173

          set URL=http://localhost:%PORT%

          if exist "C:\Program Files\Google\Chrome\Application\chrome.exe" (
              start "" "C:\Program Files\Google\Chrome\Application\chrome.exe" "%URL%"
              exit /b
          )

          if exist "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" (
              start "" "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" "%URL%"
              exit /b
          )

          if exist "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" (
              start "" "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" "%URL%"
              exit /b
          )

          if exist "C:\Program Files\Microsoft\Edge\Application\msedge.exe" (
              start "" "C:\Program Files\Microsoft\Edge\Application\msedge.exe" "%URL%"
              exit /b
          )

          start "" "%URL%"
          '@ |
            Set-Content `
              -Path $startupFile `
              -Encoding ASCII

          Write-Host ""
          Write-Host "Browser auto-open configured:"
          Write-Host $startupFile
          Write-Host ""


      # ============================================================
      # 8. CONFIGURE MT5 + MT4
      # ============================================================

      - name: 8. Detect Executables and Create Login Configs
        shell: pwsh
        run: |
          $desktop = $env:RDP_DESKTOP

          if (-not $desktop) {
              $desktop = "C:\Users\RDP\Desktop"
          }


          # ========================================================
          # MT5
          # ========================================================

          $mt5Candidates = Get-ChildItem `
            -Path "$desktop\MT5_Platform" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.Name -in @(
                    "terminal64.exe",
                    "terminal.exe",
                    "launcher.exe"
                )
            }

          $mt5Exe = $mt5Candidates |
            Sort-Object @{
                Expression = {

                    switch ($_.Name) {

                        "terminal64.exe" { 0 }

                        "terminal.exe" { 1 }

                        "launcher.exe" { 2 }

                        default { 9 }
                    }
                }
            } |
            Select-Object -First 1

          if (-not $mt5Exe) {

              Write-Host "MT5 executable not found." `
                -ForegroundColor Red

              exit 1
          }

          $mt5Dir = $mt5Exe.DirectoryName

          $vmIniPath = Join-Path `
            $mt5Dir `
            "vm.ini"

          $vmContent = @(

              "[Common]"

              "Login=52814428"

              "Password=XWkO&5Z00tXPr8"

              "Server=ICMarketsSC-Demo"

              "KeepPrivate=1"

              "NewsEnable=0"

          ) -join "`r`n"

          $vmContent |
            Out-File `
              -FilePath $vmIniPath `
              -Encoding Unicode `
              -Force

          "MT5_EXE=$($mt5Exe.FullName)" >> $env:GITHUB_ENV
          "MT5_INI=$vmIniPath" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "MT5 EXE:"
          Write-Host $mt5Exe.FullName


          # ========================================================
          # MT4
          # ========================================================

          $mt4Exe = Get-ChildItem `
            -Path "$desktop\MT4_Platform" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.Name -eq "terminal.exe"
            } |
            Select-Object -First 1

          if (-not $mt4Exe) {

              Write-Host "MT4 executable not found." `
                -ForegroundColor Red

              exit 1
          }

          $mt4Dir = $mt4Exe.DirectoryName

          $terminalIniPath = Join-Path `
            $mt4Dir `
            "terminal.ini"

          $mt4Content = @(

              "Login=31335811"

              "Password=dcym47"

              "Server=ICMarketsSC-Demo03"

          ) -join "`r`n"

          $mt4Content |
            Out-File `
              -FilePath $terminalIniPath `
              -Encoding ascii `
              -Force

          "MT4_EXE=$($mt4Exe.FullName)" >> $env:GITHUB_ENV
          "MT4_INI=$terminalIniPath" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "MT4 EXE:"
          Write-Host $mt4Exe.FullName


      # ============================================================
      # 9. CONNECT TAILSCALE
      # ============================================================

      - name: 9. Connect Tailscale
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |
          if (-not $env:TS_KEY) {

              Write-Host "TAILSCALE_AUTH_KEY secret is empty." `
                -ForegroundColor Red

              exit 1
          }

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "$env:TEMP\ts.msi"

          Start-Process `
            msiexec.exe `
            -ArgumentList `
              "/i",
              "$env:TEMP\ts.msi",
              "/quiet",
              "/norestart" `
            -Wait

          & "C:\Program Files\Tailscale\tailscale.exe" `
            up `
            --authkey=$env:TS_KEY `
            --hostname=Trader-VM

          if ($LASTEXITCODE -ne 0) {

              Write-Host "tailscale up failed." `
                -ForegroundColor Red

              exit $LASTEXITCODE
          }

          Start-Sleep -Seconds 5

          $tsIP = & `
            "C:\Program Files\Tailscale\tailscale.exe" `
            ip `
            -4 |
            Select-Object -First 1

          if (-not $tsIP) {

              Write-Host "Tailscale failed to obtain an IP." `
                -ForegroundColor Red

              & "C:\Program Files\Tailscale\tailscale.exe" status

              exit 1
          }

          $tsIP = $tsIP.Trim()

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $tsIP
          Write-Host ""


      # ============================================================
      # 10. LAUNCH MT4 + MT5
      # ============================================================

      - name: 10. Launch MT4 and MT5
        shell: pwsh
        run: |
          Get-Process `
            -Name `
              "terminal",
              "terminal64",
              "launcher",
              "metatrader" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3


          # ========================================================
          # MT5
          # ========================================================

          if (
              $env:MT5_EXE -and
              (Test-Path $env:MT5_EXE)
          ) {

              Write-Host "Launching MT5..."

              Start-Process `
                -FilePath $env:MT5_EXE `
                -ArgumentList `
                  "/portable",
                  "/config:$env:MT5_INI" `
                -WorkingDirectory `
                  (Split-Path $env:MT5_EXE -Parent)
          }
          else {

              Write-Host "MT5 executable missing." `
                -ForegroundColor Yellow
          }

          Start-Sleep -Seconds 8


          # ========================================================
          # MT4
          # ========================================================

          if (
              $env:MT4_EXE -and
              (Test-Path $env:MT4_EXE)
          ) {

              Write-Host "Launching MT4..."

              Start-Process `
                -FilePath $env:MT4_EXE `
                -ArgumentList `
                  "/portable",
                  "`"$env:MT4_INI`"" `
                -WorkingDirectory `
                  (Split-Path $env:MT4_EXE -Parent)
          }
          else {

              Write-Host "MT4 executable missing." `
                -ForegroundColor Yellow
          }


      # ============================================================
      # 11. KEEP RDP ALIVE
      # ============================================================

      - name: 11. Keep Alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "                 RDP READY"
          Write-Host "============================================"

          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "User    : $env:RDP_USER"
          Write-Host "Pass    : $env:RDP_PASS"

          Write-Host ""

          Write-Host "Digital Time Wheel Repository:"
          Write-Host $env:DIGITAL_TIME_WHEEL

          Write-Host ""

          Write-Host "Digital Time Wheel App:"
          Write-Host $env:DIGITAL_APP_PATH

          Write-Host ""

          if ($env:DIGITAL_WEB_PORT) {
              Write-Host "Website:"
              Write-Host "http://localhost:$env:DIGITAL_WEB_PORT"
          }
          else {
              Write-Host "Website port will be detected by browser startup script."
          }

          Write-Host ""

          Write-Host "MT5:"
          Write-Host $env:MT5_EXE

          Write-Host ""

          Write-Host "MT4:"
          Write-Host $env:MT4_EXE

          Write-Host ""
          Write-Host "============================================"

          $end = (Get-Date).AddMinutes(345)

          while ((Get-Date) -lt $end) {
              Start-Sleep -Seconds 60
          }

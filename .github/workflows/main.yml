name: RDP (Tailscale) + Download Release ZIP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 | Out-Null

          Restart-Service -Name TermService -Force

      - name: Create RDP User (random password each run)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.Security
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $user = "RDP"
          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-LocalUser -Name $user -Password $securePass -AccountNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name $user -Password $securePass
          }

          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

          "RDP_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RDP_PASS=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          New-Item -ItemType Directory -Force -Path "C:\Users\RDP\Desktop" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\Users\Public\Desktop" | Out-Null

      - name: Download OneRoyal ZIP from latest Release + unzip to Desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $owner = "${{ github.repository_owner }}"
          $repo  = "${{ github.event.repository.name }}"
          $assetName = "OneRoyal.MT4.Terminal.zip"

          $api = "https://api.github.com/repos/$owner/$repo/releases/latest"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent"  = "gh-actions"
            Accept        = "application/vnd.github+json"
          }

          $rel = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) {
            $names = ($rel.assets | ForEach-Object { $_.name }) -join ", "
            throw "Asset not found. Expected: $assetName. Found: $names"
          }

          $rdpDesktop    = "C:\Users\RDP\Desktop"
          $publicDesktop = "C:\Users\Public\Desktop"

          $zipPath1 = Join-Path $rdpDesktop $assetName
          $zipPath2 = Join-Path $publicDesktop $assetName

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath1 -Headers $headers
          Copy-Item -Force $zipPath1 $zipPath2

          $extractDir = Join-Path $rdpDesktop "Restored_OneRoyal_MT4"
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Expand-Archive -Path $zipPath1 -DestinationPath $extractDir -Force

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          & $tsExe up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=gh-rdp-$env:GITHUB_RUN_ID | Out-Null

          $tsIP = $null
          for ($i=0; $i -lt 20; $i++) {
            $tsIP = (& $tsExe ip -4) | Select-Object -First 1
            if ($tsIP) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $tsIP) { throw "Tailscale IP not assigned" }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show RDP access info
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "ZIP     : C:\Users\RDP\Desktop\OneRoyal.MT4.Terminal.zip"
          Write-Host "Extract : C:\Users\RDP\Desktop\Restored_OneRoyal_MT4"
          Write-Host "=================="
          Write-Host ""

      - name: Maintain Connection
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes(345)
          while ((Get-Date) -lt $end) {
            Write-Host "[$(Get-Date -Format s)] RDP Active"
            Start-Sleep -Seconds 300
          }
